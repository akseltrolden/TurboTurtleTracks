<link rel="stylesheet" href="style.css">
<div class="app">
  <header>
    <div class="brand">
      <span class="turtle">🐢</span>
      <div>
        <h1>TurboTurtle Tracks</h1>
        <p>Your audio, at your pace.</p>
      </div>
    </div>
    <span class="version">BETA 0.1</span>
  </header>

  <main>
    <section class="source-options">
      <button id="driveBtn" class="primary">
        <span>☁</span> Open from Google Drive
      </button>
      <label class="secondary upload-btn">
        <span>＋</span> Open local MP3
        <input id="fileInput" type="file"
               accept=".mp3,audio/mpeg,audio/*" hidden>
      </label>
    </section>

    <section class="player">
      <div class="track-art">♫</div>

      <div class="track-info">
        <h2 id="trackName">No track loaded</h2>
        <p id="trackSource">Choose an MP3 to get started</p>
      </div>

      <audio id="audio"></audio>

      <div class="timeline">
        <input id="seek" type="range"
               min="0" max="100" value="0">
        <div class="time">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="transport">
        <button id="backBtn" title="Back 10 seconds">↶ 10</button>
        <button id="playBtn" class="play-button">▶</button>
        <button id="forwardBtn" title="Forward 10 seconds">10 ↷</button>
      </div>

      <div class="speed-section">
        <div class="speed-heading">
          <span>PLAYBACK SPEED</span>
          <strong id="speedValue">1.00×</strong>
        </div>

        <div class="speed-buttons" id="speedButtons">
          <button data-speed="0.5">0.5×</button>
          <button data-speed="0.75">0.75×</button>
          <button data-speed="1">1×</button>
          <button data-speed="1.25">1.25×</button>
          <button data-speed="1.5" class="selected">1.5×</button>
          <button data-speed="1.75">1.75×</button>
          <button data-speed="2">2×</button>
          <button data-speed="2.5">2.5×</button>
          <button data-speed="3">3×</button>
        </div>

        <input id="speedSlider" type="range"
               min="0.5" max="3" step="0.05" value="1">

        <label class="pitch-option">
          <input id="pitchToggle" type="checkbox" checked>
          Preserve natural voice pitch
        </label>
      </div>

      <div class="volume-section">
        <span>Volume</span>
        <input id="volume" type="range"
               min="0" max="1" step="0.01" value="0.8">
      </div>
    </section>

    <div id="status" class="status">
      Ready to play.
    </div>

  </main>

  <footer>
    TurboTurtle Tracks · Audio stays in your browser
  </footer>
</div>
<script src="script.js"></script>
